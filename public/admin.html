<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#0b141a">
  <title>Админка поддержки</title>
  <link rel="icon" type="image/png" href="/logo.png">
  <link rel="apple-touch-icon" href="/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/admin.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div id="login" class="auth">
    <form class="auth-card" id="login-form">
      <div class="brand">
        <div class="logo"><img src="/logo.png" alt=""></div>
        <div>
          <h1>Админка поддержки</h1>
          <p>Диалоги, настройки и шаблоны ответов</p>
        </div>
      </div>
      <input id="tok" type="password" placeholder="ADMIN_TOKEN" autocomplete="current-password" aria-label="ADMIN_TOKEN">
      <button id="lbtn" type="submit">Войти</button>
      <div id="lerr" class="err" role="alert"></div>
    </form>
  </div>

  <div id="app" class="app">
    <header class="top">
      <div class="brand">
        <div class="logo"><img src="/logo.png" alt=""></div>
        <div><h1>Поддержка</h1><p>Панель оператора</p></div>
      </div>
      <div class="spacer"></div>
      <div class="status"><i id="cdot" class="dot"></i><span id="ctxt">подключение</span></div>
      <button id="logout-btn" class="ghost">Выйти</button>
      <div id="mobile-ticket-top" class="mobile-ticket-top" aria-hidden="true">
        <button id="mobile-ticket-back" class="mobile-ticket-back" type="button" aria-label="К списку тикетов">‹</button>
        <div id="mobile-ticket-avatar" class="avatar"></div>
        <div class="mobile-ticket-copy">
          <b id="mobile-ticket-name">—</b>
          <span id="mobile-ticket-summary">—</span>
        </div>
        <button id="mobile-ticket-card" class="mobile-ticket-card" type="button">Карточка</button>
        <button id="mobile-ticket-toggle" class="mobile-ticket-toggle danger" type="button">Закрыть</button>
      </div>
    </header>

    <div class="workspace">
      <nav class="rail" aria-label="Разделы админки">
        <button class="navbtn on" data-view="chat" title="Диалоги" aria-label="Диалоги">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/></svg>
        </button>
        <button class="navbtn" data-view="settings" title="Настройки" aria-label="Настройки">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 8.6 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 8.6a1.7 1.7 0 0 0-.34-1.88l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1V3a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15.4 4.6a1.7 1.7 0 0 0 1.88-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9c.43.17.78.5 1 .9.18.34.36.7.7.7H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.5.4Z"/></svg>
        </button>
        <button class="navbtn" data-view="templates" title="Шаблоны" aria-label="Шаблоны">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>
        </button>
        <button class="navbtn" data-view="health" title="Состояние системы" aria-label="Состояние системы">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h4l2-7 4 14 2-7h6"/><path d="M4 4h16v16H4z"/></svg>
        </button>
      </nav>

      <aside class="side" id="side">
        <div class="side-head">
          <div class="metrics">
            <div class="metric"><b id="m-open">0</b><span>открыто</span></div>
            <div class="metric"><b id="m-unread">0</b><span>новых</span></div>
            <div class="metric"><b id="m-all">0</b><span>всего</span></div>
          </div>
          <input id="srch" class="search" type="search" placeholder="Поиск по имени или ID" aria-label="Поиск по имени или ID">
          <div class="tabs">
            <button class="tab on" data-tab="open">Открытые</button>
            <button class="tab" data-tab="closed">Закрытые</button>
            <button class="tab" data-tab="all">Все</button>
          </div>
        </div>
        <div id="tlist" class="tickets"></div>
      </aside>

      <main class="main" id="main">
        <section id="welcome" class="welcome">
          <div><h2>Выберите диалог</h2><p>Слева находятся тикеты клиентов. Настройки и шаблоны ответов доступны в меню.</p></div>
        </section>
        <section id="chat" class="chat">
          <div class="chat-head">
            <button id="back" class="back" aria-label="Назад">‹</button>
            <div id="cv-av" class="avatar"></div>
            <div class="chat-title"><b id="cv-name">—</b><span id="cv-sub">—</span></div>
            <button id="cv-toggle" class="danger">Закрыть</button>
          </div>
          <div id="cv-msgs" class="msgs"></div>
          <div id="typing" class="typing">Пользователь печатает...</div>
          <div id="composer" class="composer"></div>
        </section>
        <section id="settings" class="panel"></section>
        <section id="templates" class="panel"></section>
        <section id="health" class="panel"></section>
      </main>
    </div>
  </div>

  <div id="toast" class="toast" role="status"></div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/admin-enhance.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
