<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0b141a">
  <meta name="color-scheme" content="dark">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" href="/logo.png">
  <link rel="apple-touch-icon" href="/logo.png">
  <link rel="stylesheet" href="/css/chat.css?v=20260806-2">
  <title>Поддержка</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
  (() => {
    const tg = window.Telegram?.WebApp;
    const params = new URLSearchParams(location.search);
    const start = tg?.initDataUnsafe?.start_param || params.get('startapp') || params.get('start_param');
    if (start === 'admin' || params.get('admin') === '1') {
      location.replace(`/miniapp?v=${Date.now().toString(36)}`);
    }
  })();
  </script>
</head>
<body>
  <main id="app">
    <section id="ls" class="scr on" aria-label="Начало чата">
      <div class="lcard">
        <img src="/logo.png" alt="">
        <div class="ltit">Поддержка</div>
        <div class="lstatus">Операторы на связи</div>
        <div class="lsub">Представьтесь — и напишите вопрос в защищённом чате</div>
        <input id="ni" class="linp" type="text" placeholder="Ваше имя" maxlength="50" autocomplete="given-name" enterkeyhint="go" aria-label="Ваше имя">
        <button id="sb" class="lbtn" type="button" disabled>
          <span id="sl">Начать чат</span>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M2.5 8h11M8.5 3.5l5 4.5-5 4.5"/></svg>
        </button>
      </div>
    </section>

    <section id="cs" class="scr" aria-label="Чат с поддержкой">
      <header class="hdr">
        <img src="/logo.png" alt="">
        <div class="hin">
          <div class="hname">Служба поддержки</div>
          <div class="hst"><span class="hdot"></span><span class="hstxt">подключение...</span></div>
        </div>
        <button class="hbtn hbtn-ico" id="nbtn" type="button" title="Включить уведомления" aria-label="Включить уведомления">
          <svg width="17" height="17" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 1.5a4.5 4.5 0 0 0-4.5 4.5v3l-1 1.5h11l-1-1.5V6A4.5 4.5 0 0 0 8 1.5z"/><path d="M6.5 13a1.5 1.5 0 0 0 3 0"/></svg>
        </button>
        <button class="hbtn" id="hcl" type="button" aria-label="Закрыть тикет">
          <svg width="14" height="14" viewBox="0 0 13 13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="1" y="1" width="11" height="11" rx="2"/><path d="M4 4l5 5M9 4l-5 5"/></svg>
          <span class="hbtxt">Закрыть</span>
        </button>
      </header>

      <div class="chat-stage">
        <div class="dropzone" id="dropzone">
          <div class="dropcard">
            <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 8 5-5 5 5"/><path d="M5 15v3a3 3 0 0 0 3 3h8a3 3 0 0 0 3-3v-3"/></svg>
            <b>Отпустите файл здесь</b>
            <span>Фото, видео, аудио и документы до 50 МБ</span>
          </div>
        </div>
        <div class="mwrap" id="mwrap"><div class="mlist" id="ml" aria-live="polite"></div></div>
        <button class="sdwn" id="sdwn" type="button" aria-label="Перейти к новым сообщениям">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M2.5 5.5l4.5 4.5 4.5-4.5"/></svg>
        </button>
      </div>

      <div class="typing-bar" id="typing-bar" style="display:none">
        <div class="typing-dots" aria-hidden="true"><span></span><span></span><span></span></div>
        <span class="typing-lbl">Поддержка печатает...</span>
      </div>

      <div class="cbar" id="cbar">
        <div class="cbar-t">Тикет закрыт</div>
        <button class="newbtn" id="newbtn" type="button">
          <svg width="15" height="15" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M7.5 1v13M1 7.5h13"/></svg>
          Начать новый чат
        </button>
      </div>

      <div class="epick" id="ep" style="display:none"></div>

      <div class="iarea" id="ia">
        <div class="fprev" id="fp" style="display:none">
          <div class="fpi">
            <div class="fpth" id="fpth"></div>
            <button class="fprm" id="fprm" type="button" aria-label="Убрать вложение">
              <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M1 1l8 8M9 1 1 9"/></svg>
            </button>
          </div>
        </div>
        <div class="irow">
          <button class="icn" id="abt" type="button" aria-label="Прикрепить файл">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m20.5 11.5-8.9 8.9a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/></svg>
          </button>
          <input type="file" id="fi" accept="image/*,video/*,audio/*,.jpg,.jpeg,.jpe,.jfif,.heic,.heif,.heics,.heifs,.dng,.avif,.tif,.tiff,.pdf,.doc,.docx,.zip,.txt,.csv,.xls,.xlsx,.pptx,.7z,.rar" hidden>
          <div class="tbox"><textarea id="ti" placeholder="Сообщение" rows="1" enterkeyhint="send" aria-label="Сообщение"></textarea></div>
          <button class="icn" id="ebt" type="button" aria-label="Выбрать эмодзи">
            <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="9"/><path d="M7 14s1.2 2.5 4 2.5 4-2.5 4-2.5"/><circle cx="8" cy="9" r="1.1" fill="currentColor" stroke="none"/><circle cx="14" cy="9" r="1.1" fill="currentColor" stroke="none"/></svg>
          </button>
          <button class="sndbtn" id="sndbtn" type="button" disabled aria-label="Отправить">
            <svg width="19" height="19" viewBox="0 0 19 19" fill="currentColor" aria-hidden="true"><path d="M2.5 9.5 17 3l-7 14-.8-6.5-6.7-1z"/></svg>
          </button>
        </div>
      </div>
    </section>
  </main>

  <div class="tst" id="tst" role="status" aria-live="polite"></div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/app.js?v=20260806-2"></script>
  <script>
  (() => {
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fi');
    const toast = document.getElementById('tst');
    if (!dropzone || !fileInput) return;
    let depth = 0;
    const hasFiles = event => Array.from(event.dataTransfer?.types || []).includes('Files');
    const show = on => dropzone.classList.toggle('on', on);
    const note = text => {
      if (!toast) return;
      toast.innerHTML = `<span class="tst-ico">ℹ</span><span>${text}</span>`;
      toast.dataset.type = 'info';
      toast.classList.remove('on');
      void toast.offsetWidth;
      toast.classList.add('on');
      setTimeout(() => toast.classList.remove('on'), 1800);
    };
    document.addEventListener('dragenter', event => {
      if (!hasFiles(event)) return;
      event.preventDefault();
      depth += 1;
      show(true);
    }, false);
    document.addEventListener('dragover', event => {
      if (!hasFiles(event)) return;
      event.preventDefault();
      show(true);
    }, false);
    document.addEventListener('dragleave', event => {
      if (!hasFiles(event)) return;
      depth = Math.max(0, depth - 1);
      if (!depth) show(false);
    }, false);
    document.addEventListener('drop', event => {
      if (!hasFiles(event)) return;
      event.preventDefault();
      depth = 0;
      show(false);
      const file = event.dataTransfer.files?.[0];
      if (!file) return;
      const transfer = new DataTransfer();
      transfer.items.add(file);
      fileInput.files = transfer.files;
      fileInput.dispatchEvent(new Event('change', { bubbles: true }));
      note('Файл прикреплён');
    }, false);
  })();
  </script>
</body>
</html>
