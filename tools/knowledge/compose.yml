services:
  knowledge:
    build: .
    restart: unless-stopped
    network_mode: host
    env_file: .env
    volumes:
      - knowledge-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7900/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
volumes:
  knowledge-data:
