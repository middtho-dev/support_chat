services:
  voice:
    build: .
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 128
    network_mode: host
    env_file: .env
    volumes:
      - voice-data:/app/data
volumes:
  voice-data:
