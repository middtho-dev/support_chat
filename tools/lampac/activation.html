<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Активация устройства</title><body>
<!--SCREEN-->
<style>
#workspace-access-disabled{position:fixed;inset:0;z-index:2147483647;overflow:auto;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;background:radial-gradient(ellipse at 50% 0%,#163d55 0%,#0e1621 65%);color:#e7eef5;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;text-align:center}
#workspace-access-disabled *{box-sizing:border-box}#workspace-access-disabled .wa-card{width:100%;max-width:560px;padding:40px 32px;border:1px solid #ffffff15;border-radius:28px;background:#17212be8;box-shadow:0 32px 100px #0005}
#workspace-access-disabled img{width:80px;height:80px;object-fit:contain;margin:0 auto 24px;display:block}#workspace-access-disabled .wa-badge{display:inline-block;color:#69c7ef;background:#2b9fd41c;border:1px solid #2b9fd444;border-radius:30px;padding:6px 14px;font-size:12px;letter-spacing:.03em}
#workspace-access-disabled h1{font-size:30px;line-height:1.2;margin:20px 0 14px;font-weight:650}#workspace-access-disabled p{color:#98aabc;margin:12px 0}#workspace-access-disabled a{display:block;text-decoration:none;background:#2b9fd4;color:#fff;padding:14px 18px;border-radius:14px;font-weight:600;margin:24px 0 18px}#workspace-access-disabled a:focus{outline:3px solid white;outline-offset:5px}#workspace-access-disabled .wa-id{padding:12px;border-radius:12px;background:#0e1621;font-size:12px;color:#8ba3b8;overflow-wrap:anywhere}#workspace-access-disabled code{color:#cdddea;display:block;margin-top:4px;font:13px/1.5 monospace}#workspace-access-disabled .wa-status{font-size:12px;margin:18px 0 0}
@media(max-width:480px){#workspace-access-disabled{padding:16px}#workspace-access-disabled .wa-card{padding:28px 20px}#workspace-access-disabled h1{font-size:25px}}
</style>
<div id="workspace-access-disabled" role="dialog" aria-modal="true" aria-labelledby="wa-title"><section class="wa-card"><img src="LOGO_URL" alt="Поддержка"><span class="wa-badge">Устройство подключено</span><h1 id="wa-title">Остался один шаг</h1><p>Обратитесь в службу поддержки<br>для активации устройства.</p><a href="SUPPORT_URL" target="_blank" rel="noopener">Обратиться в поддержку</a><div class="wa-id">Сообщите поддержке ID устройства<code data-workspace-id>Подключение…</code></div><p class="wa-status" role="status">Ожидаем активацию · доступ откроется автоматически</p></section></div>
<!--POLL-->
<script>
(function(){var busy=false;function poll(){if(busy)return;var match=document.cookie.match(/(?:^|; )workspace_device=([^;]*)/);if(!match)return;busy=true;var x=new XMLHttpRequest();x.open('POST','/workspace-device/poll');x.timeout=12000;x.setRequestHeader('Content-Type','application/json');x.onload=function(){busy=false;try{var d=JSON.parse(x.responseText);if(d.id)document.querySelector('[data-workspace-id]').textContent=d.id;if(d.enabled===true)location.reload();}catch(e){}};x.onerror=x.ontimeout=function(){busy=false;};x.send(JSON.stringify({token:decodeURIComponent(match[1]),applied:0,snapshot:{}}));}poll();setInterval(poll,5000);})();
</script></body></html>
