services:
  firmware:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:7700:7700"
    env_file: .env
    volumes:
      - firmware-data:/data
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      options:
        max-size: "5m"
        max-file: "2"
volumes:
  firmware-data:
