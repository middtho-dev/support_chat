name: Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: npm run check

      - name: Deployment shell syntax
        run: bash -n tools/frp/setup-https.sh scripts/write-caddyfile.sh

      - name: Integration tests
        run: npm test

      - name: FRP standalone checks
        working-directory: tools/frp
        run: |
          npm run check
          npm test

      - name: Voice standalone checks
        working-directory: tools/voice
        run: |
          npm run check
          npm test
