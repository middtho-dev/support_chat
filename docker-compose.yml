services:
  support-chat:
    build: .
    container_name: support-chat
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 192
    stop_grace_period: 15s
    network_mode: host
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - APP_VERSION=${APP_VERSION:-unknown}
      - PORT=${PORT:-3001}
      - HOST=127.0.0.1
      - DB_PATH=/app/data/support.db
      - UPLOADS_DIR=/app/public/uploads
      - BACKUP_DIR=/app/backups
      - WORKSPACE_BACKUP_STATUS_PATH=/run/kv9ru/backup-status.json
      - VAPID_STORE=/app/data/vapid.json
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_MODE=${TELEGRAM_MODE:-private}
      - TELEGRAM_GROUP_ID=${TELEGRAM_GROUP_ID:-}
      - TELEGRAM_ADMIN_IDS=${TELEGRAM_ADMIN_IDS:-}
      - PUBLIC_URL=${PUBLIC_URL:-}
      - TELEGRAM_WEBAPP_URL=${TELEGRAM_WEBAPP_URL:-}
      - ADMIN_TOKEN=${ADMIN_TOKEN}
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://127.0.0.1:$$PORT/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    volumes:
      - support-data:/app/data
      - support-uploads:/app/public/uploads
      - support-backups:/app/backups
      - type: bind
        source: /var/lib/kv9ru
        target: /run/kv9ru
        read_only: true
        bind:
          create_host_path: false

volumes:
  support-data:
  support-uploads:
  support-backups:
